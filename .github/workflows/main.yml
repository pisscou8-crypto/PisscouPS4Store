name: Pisscou PS4 Store

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make curl

      - name: Download OpenOrbis
        run: |
          curl -fL \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            -o openorbis.tar.gz

          mkdir openorbis
          tar -xzf openorbis.tar.gz -C openorbis

      - name: Locate Toolchain
        run: |
          TOOL=$(find "$GITHUB_WORKSPACE/openorbis" \
            -type f \
            -name PkgTool.Core \
            | head -n 1)

          if [ -z "$TOOL" ]; then
            echo "OpenOrbis toolchain not found"
            exit 1
          fi

          TOOLCHAIN=$(dirname "$(dirname "$(dirname "$TOOL")")")

          echo "OO_PS4_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"

          chmod +x "$TOOLCHAIN"/bin/linux/* || true

      - name: Create project from official sample
        run: |
          rm -rf project

          cp -a \
            "$OO_PS4_TOOLCHAIN/samples/hello_world" \
            project

          echo "===== PROJECT ====="
          find project -maxdepth 4 -type f | sort

      - name: Build
        working-directory: project
        run: |
          make clean || true
          make

      - name: Find PKG
        run: |
          PKG=$(find project -type f -name "*.pkg" | head -n 1)

          if [ -z "$PKG" ]; then
            echo "NO PKG WAS CREATED"
            find project -maxdepth 6 -type f | sort
            exit 1
          fi

          echo "PKG=$PKG" >> "$GITHUB_ENV"
          echo "Created: $PKG"

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: PisscouPS4Store-Test
          path: ${{ env.PKG }}
